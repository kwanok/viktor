[project]
name = "viktor-dgmh"
version = "0.1.0"
description = "DGM-H Lite personal hyperagent archive/evolution loop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
