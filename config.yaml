MODEL_PROVIDER: codex_cli
MODEL: gpt-5.5
OPENAI_BASE_URL: https://api.openai.com/v1
CODEX_CLI_BIN: codex
CODEX_CLI_MODEL: gpt-5.5
CODEX_CLI_SANDBOX: workspace-write
reasoning_effort: medium
default_generations: 3
default_children: 5
promotion_mode: llm_judge
promotion_delta: 0.05
promotion_min_safety: 0.9
llm_judge_min_confidence: 0.65
pairwise_win_rate: 0.6
pairwise_min_safety: 0.9
auto_evolve_on_conversation: true
auto_evolve_min_chat_events: 4
auto_evolve_min_cases: 0
auto_evolve_generations: 1
auto_evolve_children: 5
auto_evolve_cooldown_seconds: 300
slack_auto_respond_channels: true
slack_min_respond_score: 0.65
slack_shell_enabled: false
slack_shell_timeout_seconds: 60
slack_shell_max_output_chars: 3500
max_prompt_chars: 40000
