_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Viktor DGM-H
  description: Personal imitation DGM-H feedback bot
  background_color: "#1f2937"
features:
  bot_user:
    display_name: Viktor
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - channels:history
      - groups:history
      - im:history
      - im:read
      - im:write
      - mpim:history
      - reactions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
